services:
  privilege-audit:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-privilege-audit:local
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      TMPDIR: /tmp
      PRIV_AUDIT_JOB_DIR: /tmp/privilege-audit-jobs
      PRIV_AUDIT_JOB_TTL: "3600"
    read_only: true
    tmpfs:
      - "/tmp:size=${UPLOAD_TMP_SIZE:-1024m},mode=1777"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
